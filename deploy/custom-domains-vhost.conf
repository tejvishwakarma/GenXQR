# Custom domains (backend custom-domain.service.ts) — paste into the CloudPanel
# Vhost Editor of a SEPARATE site created for customers.genxqr.com.
#
# Customers CNAME qr.theirbrand.com to customers.genxqr.com. Cloudflare for SaaS
# terminates their HTTPS and proxies here with Host = the customer's hostname,
# so this server block must answer for hostnames nobody can list in advance:
# server_name below is the CNAME target plus a catch-all regex. nginx always
# prefers an exact server_name, so every other site on this server keeps its
# own traffic; only hosts no site claims fall through to here, and the backend
# answers 404 for any host that is not a verified customer domain.
#
# ONLY scan-facing paths are served. The dashboard, login, admin, marketing
# pages and the service worker answer 404 here, so a customer's domain can
# never carry a GenXQR login page (phishing) or install our service worker.
#
# Keep angle brackets out of this file, comments included: CloudPanel strips
# anything tag-like and rejects the vhost (CLAUDE.md, section 17).

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name customers.genxqr.com ~^[a-z0-9-]+(\.[a-z0-9-]+)+$;
  root /home/genxqr/htdocs/genxqr.com/frontend/dist;

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # Let's Encrypt for customers.genxqr.com itself (CloudPanel).
  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  # global_settings (CloudPanel) already sends X-Frame-Options and
  # X-XSS-Protection; the rest are set here, as on genxqr.com.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Scan pages only: no analytics, payments or captcha hosts (none load here).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

  # The scan itself. Own header set and NO CSP, exactly like genxqr.com: the
  # backend sends a per-response nonce CSP for the tracking-pixel page.
  location ~ ^/r/([a-zA-Z0-9_-]+)$ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Password page: GET is the SPA page, POST checks the password.
  location ~ ^/r/([a-zA-Z0-9_-]+)/password$ {
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    limit_except GET HEAD OPTIONS {
      proxy_pass http://127.0.0.1:3001;
    }
    try_files /app-shell.html =404;
    expires epoch;
  }

  # "This code is no longer available" page.
  location ~ ^/r/[a-zA-Z0-9_-]+/expired$ {
    try_files /app-shell.html =404;
    expires epoch;
  }

  # Landing pages (menus, vCards, PDFs, link pages ...).
  location ~ ^/l/[a-zA-Z0-9_-]+$ {
    try_files /app-shell.html =404;
    expires epoch;
  }

  # The only API the scan pages call: content, branding. The backend scopes both
  # to the domain's owner.
  location ^~ /api/public/ {
    proxy_hide_header  Content-Security-Policy;
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  Cross-Origin-Opener-Policy;
    proxy_hide_header  Origin-Agent-Cluster;
    proxy_hide_header  X-Powered-By;
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
  }

  # Files shown on landing pages (PDFs, images, audio). Same rules as genxqr.com.
  location ^~ /uploads/cvs/ {
    deny all;
    return 404;
  }
  location ^~ /uploads/ {
    alias /home/genxqr/htdocs/genxqr.com/backend/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; object-src 'none'; script-src 'none'; style-src 'none'; frame-ancestors 'none'; sandbox;" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    location ~* \.(php|pl|py|sh|cgi)$ {
      deny all;
    }
  }

  # Never our service worker on a customer's domain. Exact match beats the
  # asset regex below.
  location = /sw.js {
    return 404;
  }

  # Built assets and translations the SPA shell loads.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }
  location ^~ /locales/ {
    expires 7d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }
  location ~* ^/[a-zA-Z0-9_-]+\.(js|css|png|ico|svg|webp|woff2)$ {
    expires 1d;
    access_log off;
  }

  # Everything else (dashboard, login, admin, marketing, other APIs): not here.
  location / {
    return 404;
  }
}
