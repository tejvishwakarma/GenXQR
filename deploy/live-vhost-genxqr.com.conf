# genxqr.com — the live CloudPanel vhost, corrected.
#
# This is the actual config running in production (CloudPanel → Site → Vhost
# Editor), kept here so it is reviewable and diffable. CloudPanel owns the copy
# that serves traffic: editing this file changes nothing until it is pasted there
# and nginx is reloaded.
#
# Four fixes over the version that was live:
#
#   1. location ^~ /v1/        was missing entirely. Every call to the public
#                              developer API fell through to the SPA fallback and
#                              answered 200 with index.html — no 404, no 502, so it
#                              looked alive while returning HTML. The docs, the n8n
#                              node, the Zapier app and the Make app all target /v1.
#   2. location = /widget.js   the widget is generated by the backend, but the name
#                              ends in .js so the asset regex claimed it and looked
#                              in frontend/dist. Every embed 404'd.
#   3. location = /health      unproxied, so an uptime monitor was confirming nginx
#                              could serve index.html and would have called the site
#                              healthy with the API process down.
#   4. /r/SLUG                 was caching redirects for 5 minutes and discarding the
#                              backend's no-store. A dynamic QR is supposed to change
#                              destination; instead a phone kept its old target, and
#                              editing a URL or adding a routing rule looked broken.
#
# {{...}} are CloudPanel placeholders — leave them exactly as they are.
#
# Never write anything that looks like an HTML tag in this file, comments
# included: CloudPanel's editor strips a "script" tag and everything after it,
# and the vhost is rejected with "unexpected end of file" (24 Oct 2026).

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.genxqr.com;
  return 301 https://genxqr.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name genxqr.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # nginx's add_header does NOT merge across levels: any location declaring its
  # own add_header drops all of these. Blocks below therefore use `expires`
  # (a different module) for cache control wherever possible, which preserves
  # inheritance. Do not swap any `expires` back to add_header Cache-Control.
  # X-Frame-Options SAMEORIGIN and X-XSS-Protection "1; mode=block" are NOT set
  # here: /etc/nginx/global_settings (CloudPanel, included above, shared by every
  # site on the server) already sends both with the same values, so repeating
  # them sent each header twice (31 Oct 2026). Framing is still blocked on every
  # response by the CSP frame-ancestors below. Referrer-Policy is kept even
  # though global_settings also sends "same-origin": browsers apply the LAST
  # value, which is this one, and switching to same-origin would change what
  # Cashfree and other outside sites receive.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # style-src/font-src MUST allow Google Fonts or the site drops to system fonts.
  #
  # script-src is now strict: NO 'unsafe-inline', NO 'unsafe-eval'. The site's
  # only inline script (theme-init) was moved to an external /theme-init.js, and
  # analytics loads gtag.js as an external script — so the page runs no inline
  # JavaScript and needs no inline allowance. This is stronger than a nonce
  # scheme (which would allow specific inline scripts); here none are allowed.
  #  - Do NOT re-add 'unsafe-inline'/'unsafe-eval' to script-src. If a new inline
  #    script tag is ever needed, make it external and served from 'self' instead.
  #  - 'unsafe-inline' REMAINS on style-src: React and Tailwind emit inline
  #    styles, and style nonces are a separate, larger change.
  #  - JSON-LD (script type application/ld+json) is exempt from script-src —
  #    browsers never execute it — so the prerendered pages' structured data is
  #    fine without any allowance.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sdk.cashfree.com https://www.googletagmanager.com https://challenges.cloudflare.com https://*.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://genxqr.com https://sdk.cashfree.com https://api.cashfree.com https://sandbox.cashfree.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.clarity.ms https://c.bing.com data: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' https://*.cashfree.com https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://*.cashfree.com;" always;

  location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    # Only matters when an image (e.g. a frame SVG) is opened as a page.
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; font-src 'self' data:; sandbox" always;
    access_log off;
  }

  location ^~ /locales/ {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 7d;
    add_header Cache-Control "public, stale-while-revalidate=86400";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
  }

  location = /sw.js {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires epoch;
  }

  location = /manifest.json {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 1d;
  }
  location = /sitemap.xml {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 1d;
  }
  location = /robots.txt {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    expires 1d;
    access_log off;
  }

  # FIX 2 — Embeddable widget.
  # app.ts mounts this from widget.routes.ts, but the name ends in .js so the asset
  # regex above claimed it and looked in frontend/dist, where no such file exists.
  # `location =` is an exact match, which outranks every regex regardless of order,
  # so this wins wherever it sits in the file.
  location = /widget.js {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_hide_header  X-Powered-By;
    proxy_hide_header  Content-Security-Policy;
  }

  # FIX 3 — Health check, for uptime monitoring and deploy smoke tests.
  location = /health {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_hide_header  X-Powered-By;
    access_log off;
  }

  # ^~ so the asset regexes above can never intercept an API path ending in a
  # dotted extension — the precedence trap that broke /uploads/.
  location ^~ /api/ {
    client_max_body_size 300m;

    # Express/Helmet sets its own copies; hiding them stops responses carrying
    # two CSPs (browsers enforce the intersection) and three Referrer-Policies.
    proxy_hide_header  Content-Security-Policy;
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  Cross-Origin-Opener-Policy;
    proxy_hide_header  Origin-Agent-Cluster;

    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade          $http_upgrade;
    proxy_set_header   Connection       "upgrade";
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_hide_header  X-Powered-By;
  }

  # FIX 1 — Public developer API, authenticated by API key.
  # Its absence was silent: /v1/* fell through to the SPA fallback and returned
  # index.html with a 200, so nothing errored and the API appeared to work.
  location ^~ /v1/ {
    client_max_body_size 300m;

    proxy_hide_header  Content-Security-Policy;
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  Cross-Origin-Opener-Policy;
    proxy_hide_header  Origin-Agent-Cluster;

    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_hide_header  X-Powered-By;
  }

  location ^~ /admin-api/ {
    # allow 203.0.113.0/24;
    # deny all;

    proxy_hide_header  Content-Security-Policy;
    proxy_hide_header  X-Frame-Options;
    proxy_hide_header  Referrer-Policy;
    proxy_hide_header  Cross-Origin-Opener-Policy;
    proxy_hide_header  Origin-Agent-Cluster;

    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_hide_header  X-Powered-By;
  }

  location ~ ^/r/([a-zA-Z0-9_-]+)$ {
    proxy_pass         http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;

    # Own header set, WITHOUT a Content-Security-Policy: declaring any add_header
    # here drops the server-level set, including its CSP (script-src 'self').
    # That CSP blocked the inline scripts of the tracking-pixel page, so codes
    # with a GA/GTM/FB pixel showed a blank page. scan.routes.ts now sends a
    # per-response nonce CSP for that page; plain redirects need none.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # FIX 4 — no caching here, deliberately.
    # This block used to carry `proxy_hide_header Cache-Control; expires 5m;`,
    # which threw away the backend's no-store and cached the redirect for five
    # minutes. A dynamic QR exists so its destination can change after the code is
    # printed; instead a phone that scanned once kept the old target, and editing a
    # URL, adding a smart-routing rule or starting an A/B test all looked broken
    # with nothing to point at. scan.routes.ts sends
    #   Cache-Control: no-store, no-cache, must-revalidate, max-age=0
    # Let it through untouched — do not reintroduce `expires` here.
  }

  location ~ ^/r/([a-zA-Z0-9_-]+)/password$ {
    proxy_http_version 1.1;
    proxy_set_header   Host             $host;
    proxy_set_header   X-Real-IP        $remote_addr;
    proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    limit_except GET HEAD OPTIONS {
      proxy_pass http://127.0.0.1:3001;
    }
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    try_files $uri /app-shell.html;
  }

  location /r/ {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    try_files $uri /app-shell.html;
    expires epoch;
  }

  # Applicant CVs are NOT public — admin route only. MUST precede /uploads/.
  location ^~ /uploads/cvs/ {
    deny all;
    return 404;
  }

  # ^~ is REQUIRED: without it this loses to the image regex above, which roots
  # at frontend/dist, and every uploaded image 404s regardless of this alias.
  # Path must match where the app writes: UPLOAD_BASE is process.cwd()/uploads
  # and PM2's cwd is REPO/backend.
  location ^~ /uploads/ {
    alias /home/genxqr/htdocs/genxqr.com/backend/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; object-src 'none'; script-src 'none'; style-src 'none'; frame-ancestors 'none'; sandbox;" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location ~* \.(php|pl|py|sh|cgi)$ {
      deny all;
    }
  }

  # ── HTML pages ─────────────────────────────────────────────────────────────
  # `expires epoch` gives no-cache WITHOUT add_header, so the security headers
  # above are inherited. Never change these to add_header Cache-Control — that
  # strips CSP from every page on the site.
  #
  # Three kinds of HTML (scripts/prerender.mjs, vite.config.ts appShellPlugin):
  #   dist/index.html            the prerendered HOMEPAGE
  #   dist/ROUTE/index.html      prerendered marketing pages
  #   dist/app-shell.html        the empty SPA shell, for client-rendered routes
  #   dist/404.html              the prerendered "page not found"
  # Anything that is none of these answers 404 — not 200 with the shell, which
  # search engines treat as a "soft 404" junk page.

  # Canonical URLs have no trailing slash (every sitemap URL is slash-less), so
  # /pricing/ redirects to /pricing instead of serving a duplicate. Regex
  # locations are checked in order, so this must come before the app-route one.
  location ~ ^(.+)/$ {
    return 301 $1$is_args$args;
  }

  # Client-rendered routes (App.tsx): dashboard, admin, auth screens, invites,
  # QR landing pages. They boot from the shell.
  location ~ ^/(app|admin|login|signup|forgot-password|reset-password|verify-email|invite|l)(/|$) {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    try_files /app-shell.html =404;
    expires epoch;
  }

  location = / {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    try_files /index.html =404;
    expires epoch;
  }

  # $uri/index.html comes before any directory handling deliberately: matching
  # the prerendered file directly avoids nginx's index module, which can answer
  # a slash-less directory request with a 301 adding the trailing slash.
  location / {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    try_files $uri $uri/index.html =404;
    expires epoch;
  }

  error_page 404 /404.html;
  location = /404.html {
    root /home/genxqr/htdocs/genxqr.com/frontend/dist;
    internal;
    expires epoch;
  }
}
