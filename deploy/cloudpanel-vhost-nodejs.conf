# GenXQR — CloudPanel Vhost Editor content for genxqr.com
# ============================================================================
# This is NOT a standalone nginx.conf — CloudPanel manages the top-level
# server{} block (listen/ssl_certificate/server_name/root/logs/https-redirect)
# itself. You only replace the single default `location / { proxy_pass ... }`
# block that CloudPanel's Node.js site wizard generates with everything below.
#
# See DEPLOYMENT.md for the full step-by-step — this file is referenced from
# there. Confirmed against CloudPanel's own vhost template source:
# https://github.com/cloudpanel-io/vhost-templates/blob/master/v2/Nodejs/Nodejs
#
# Also check the `server_name` line CloudPanel generated above this block. If
# it lists a second domain you didn't intentionally add as a site alias (e.g.
# a stray "www1.genxqr.com"), remove it — the www variant is already handled
# by CloudPanel's separate redirect server{} block above the main one.
#
# Nginx-level rate limiting (limit_req_zone) is intentionally omitted — that
# directive is only valid at the http{} context, which the per-site Vhost
# Editor does not expose. Rate limiting is already enforced at the app layer
# (backend/src/middleware/rateLimit.middleware.ts, Redis-backed) — this is
# not a gap, just a different layer.
# ============================================================================

    # --- Security headers ---
    #
    # ⚠ nginx's add_header does NOT merge across levels: any location{} that
    # declares its own add_header silently drops every one inherited from here.
    #
    # This bit us in production. `location /` (the SPA fallback that serves
    # every HTML page) used to set `add_header Cache-Control "no-cache"`, which
    # discarded all of the below — so genxqr.com shipped HTML with no CSP, no
    # X-Frame-Options, and no Referrer-Policy, while /api/ responses looked
    # fine because Express/Helmet sets its own.
    #
    # The fix is to use the `expires` directive instead of `add_header` for
    # cache control wherever possible: `expires` belongs to a different module
    # and emits Cache-Control without breaking add_header inheritance. Where a
    # location genuinely needs its own add_header (the immutable asset blocks),
    # the security headers are repeated explicitly.
    #
    # After editing, verify against a real response, not just the config:
    #   curl -sI https://genxqr.com/ | grep -i 'content-security-policy\|x-frame'
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # style-src and font-src must allow Google Fonts: src/index.css pulls Inter,
    # Bricolage Grotesque, and JetBrains Mono from fonts.googleapis.com, which
    # in turn serves the font files from fonts.gstatic.com. Without both
    # origins listed the stylesheet is blocked and the whole site silently
    # falls back to system fonts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://genxqr.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # CloudPanel's `include /etc/nginx/global_settings;` (already present
    # above this block, untouched) sets server-level `root`, `gzip`, and
    # `client_max_body_size` for every site on the box. Any of those three
    # declared again here at server level fails the vhost test as a
    # duplicate directive — confirmed against three separate live errors.
    # Don't re-add gzip_* or a bare client_max_body_size/root above this
    # comment; override client_max_body_size only inside /api/ below, where
    # the 250MB video-upload limit actually needs to exceed the default
    # (see backend/src/routes/upload.routes.ts), and root only inside the
    # static-file locations, per the note further down.

    # --- Static frontend (React SPA) ---
    # CloudPanel's own {{root}} token (just above this block, already in the
    # Vhost Editor) points at the repo root, not the built SPA — and nginx
    # rejects a second `root` directive in the SAME context (server-level),
    # it errors "root directive is duplicate". A `root` declared inside a
    # location{} block is a different context, so it's repeated per-location
    # below instead. Replace <site-user> with your actual CloudPanel site user.
    index index.html;

    # Aggressive caching for hashed assets (JS, CSS bundles with contenthash)
    location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Medium-term caching for images and icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Locale files: stale-while-revalidate
    location /locales/ {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        access_log off;
    }

    # Service worker: never cache. Uses `expires epoch` (emits
    # "Cache-Control: no-cache") rather than add_header, so this executable
    # script still inherits the server-level security headers. Browsers also
    # revalidate service workers independently of Cache-Control, so dropping
    # the explicit no-store costs nothing in practice.
    location = /sw.js {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        expires epoch;
    }

    location = /manifest.json {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --- Backend API proxy (PM2-managed Node process on 127.0.0.1:3001) ---
    location /api/ {
        # 250MB video uploads + margin (see upload.routes.ts) — overrides
        # whatever CloudPanel's default is, only for this location.
        client_max_body_size 300m;

        # Express/Helmet sets its own security headers upstream. Without these,
        # responses carry BOTH sets: two Content-Security-Policy headers (which
        # browsers resolve as the intersection — the most restrictive union of
        # both, and hard to reason about) and three conflicting Referrer-Policy
        # values. Hiding the upstream copies makes nginx the single authority.
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Referrer-Policy;
        proxy_hide_header  Cross-Origin-Opener-Policy;
        proxy_hide_header  Origin-Agent-Cluster;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_hide_header  X-Powered-By;
    }

    # Admin API — restrict to your own IP once you know it (uncomment + edit):
    location /admin-api/ {
        # allow 203.0.113.0/24;
        # deny all;

        # Same de-duplication as /api/ above.
        proxy_hide_header  Content-Security-Policy;
        proxy_hide_header  X-Frame-Options;
        proxy_hide_header  Referrer-Policy;
        proxy_hide_header  Cross-Origin-Opener-Policy;
        proxy_hide_header  Origin-Agent-Cluster;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header  X-Powered-By;
    }

    # 1. QR redirect short URLs — exact match only (GET /r/slug)
    location ~ ^/r/([a-zA-Z0-9_-]+)$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=300";
    }

    # 2. Password verification (POST → backend, GET → frontend SPA route)
    location ~ ^/r/([a-zA-Z0-9_-]+)/password$ {
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        limit_except GET HEAD OPTIONS {
            proxy_pass http://127.0.0.1:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    # 3. All other /r/ sub-paths (e.g. /expired) fall through to the SPA
    location /r/ {
        try_files $uri $uri/ /index.html;
    }

    # User-uploaded files
    # User-uploaded files (PDFs, video, audio, images, avatars).
    #
    # This is the highest-risk path on the site: the content is supplied by
    # customers and served from our own origin. Because this block declares its
    # own add_header, it does NOT inherit the server-level security headers —
    # so they are repeated here in full, with a deliberately stricter CSP than
    # the rest of the site: `sandbox` and `default-src 'none'` mean that even
    # if a file somehow renders as HTML, it can't execute scripts, load
    # resources, or navigate the parent frame.
    location /uploads/ {
        alias /home/<site-user>/htdocs/genxqr.com/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; object-src 'none'; script-src 'none'; style-src 'none'; frame-ancestors 'none'; sandbox;" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }

    # React SPA fallback — serves index.html for every unmatched route, i.e.
    # every HTML page on the site. `expires epoch` emits
    # "Cache-Control: no-cache" WITHOUT using add_header, so the security
    # headers declared at server level are still inherited here. Do not
    # replace it with `add_header Cache-Control` — that silently strips them.
    location / {
        root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
        try_files $uri $uri/ /index.html;
        expires epoch;
    }
