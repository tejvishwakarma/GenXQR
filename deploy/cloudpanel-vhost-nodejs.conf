# GenXQR — CloudPanel Vhost Editor content for genxqr.com
# ============================================================================
# This is NOT a standalone nginx.conf — CloudPanel manages the top-level
# server{} block (listen/ssl_certificate/server_name/root/logs/https-redirect)
# itself. You only replace the single default `location / { proxy_pass ... }`
# block that CloudPanel's Node.js site wizard generates with everything below.
#
# See DEPLOYMENT.md for the full step-by-step — this file is referenced from
# there. Confirmed against CloudPanel's own vhost template source:
# https://github.com/cloudpanel-io/vhost-templates/blob/master/v2/Nodejs/Nodejs
#
# Also check the `server_name` line CloudPanel generated above this block. If
# it lists a second domain you didn't intentionally add as a site alias (e.g.
# a stray "www1.genxqr.com"), remove it — the www variant is already handled
# by CloudPanel's separate redirect server{} block above the main one.
#
# Nginx-level rate limiting (limit_req_zone) is intentionally omitted — that
# directive is only valid at the http{} context, which the per-site Vhost
# Editor does not expose. Rate limiting is already enforced at the app layer
# (backend/src/middleware/rateLimit.middleware.ts, Redis-backed) — this is
# not a gap, just a different layer.
# ============================================================================

    # --- Security headers ---
    # NOTE: Nginx's add_header does not merge across levels — a location that
    # sets its OWN add_header (several static-asset locations below do, for
    # Cache-Control) will not inherit these. That's an existing limitation in
    # this config, not something new; it only affects JS/CSS/image responses,
    # not HTML or API responses, where these headers matter most.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://genxqr.com; worker-src 'self' blob:; manifest-src 'self';" always;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff font/woff2;

    # --- Static frontend (React SPA) ---
    # CloudPanel's own {{root}} token (just above this block, already in the
    # Vhost Editor) points at the repo root, not the built SPA. Nginx allows a
    # second `root` directive in the same server{} context to override it —
    # add this line directly below {{root}}, not inside any location block.
    # Replace <site-user> with your actual CloudPanel site user.
    root /home/<site-user>/htdocs/genxqr.com/frontend/dist;
    index index.html;

    # Aggressive caching for hashed assets (JS, CSS bundles with contenthash)
    location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Medium-term caching for images and icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Locale files: stale-while-revalidate
    location /locales/ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        access_log off;
    }

    # Service worker: never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --- Backend API proxy (PM2-managed Node process on 127.0.0.1:3001) ---
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header  X-Powered-By;
    }

    # Admin API — restrict to your own IP once you know it (uncomment + edit):
    location /admin-api/ {
        # allow 203.0.113.0/24;
        # deny all;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_hide_header  X-Powered-By;
    }

    # 1. QR redirect short URLs — exact match only (GET /r/slug)
    location ~ ^/r/([a-zA-Z0-9_-]+)$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=300";
    }

    # 2. Password verification (POST → backend, GET → frontend SPA route)
    location ~ ^/r/([a-zA-Z0-9_-]+)/password$ {
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        limit_except GET HEAD OPTIONS {
            proxy_pass http://127.0.0.1:3001;
        }
        try_files $uri $uri/ /index.html;
    }

    # 3. All other /r/ sub-paths (e.g. /expired) fall through to the SPA
    location /r/ {
        try_files $uri $uri/ /index.html;
    }

    # User-uploaded files
    location /uploads/ {
        alias /home/<site-user>/htdocs/genxqr.com/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }

    # React SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
