# GenXQR Production Nginx Configuration
# Place at: /etc/nginx/sites-available/genxqr.streamsnatcher.com.conf
# Enable: ln -s /etc/nginx/sites-available/genxqr.streamsnatcher.com.conf /etc/nginx/sites-enabled/

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=static:10m rate=200r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name genxqr.streamsnatcher.com www.genxqr.streamsnatcher.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://genxqr.streamsnatcher.com$request_uri;
    }
}

# Redirect www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.genxqr.streamsnatcher.com;

    ssl_certificate     /etc/letsencrypt/live/genxqr.streamsnatcher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genxqr.streamsnatcher.com/privkey.pem;

    return 301 https://genxqr.streamsnatcher.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name genxqr.streamsnatcher.com;

    # SSL certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/genxqr.streamsnatcher.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/genxqr.streamsnatcher.com/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://genxqr.streamsnatcher.com; worker-src 'self' blob:; manifest-src 'self';" always;

    # Logging
    access_log /var/log/nginx/GenXQR.access.log;
    error_log  /var/log/nginx/GenXQR.error.log warn;

    # Request size limits
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # --- Static frontend (React SPA) ---
    root /var/www/GenXQR/frontend/dist;
    index index.html;

    # Aggressive caching for hashed assets (JS, CSS bundles with contenthash)
    location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Medium-term caching for images and icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Locale files: stale-while-revalidate
    location /locales/ {
        expires 7d;
        add_header Cache-Control "public, stale-while-revalidate=86400";
        access_log off;
    }

    # Service worker: never cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Manifest
    location = /manifest.json {
        add_header Cache-Control "public, max-age=86400";
    }

    # Sitemap and robots
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # --- Backend API proxy ---
    location /api/ {
        limit_req zone=api burst=30 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       "upgrade";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;

        # Remove server information headers
        proxy_hide_header X-Powered-By;
    }

    # Auth endpoints get stricter rate limiting
    location ~ ^/api/(auth|login|signup|register) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Admin API — internal access strongly recommended
    location /admin-api/ {
        # Optionally restrict to specific IP ranges:
        # allow 10.0.0.0/8;
        # deny all;

        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 1. QR redirect short URLs (GET /r/slug)
    # Only match if it's EXACTLY /r/slug (no sub-paths like /expired)
    location ~ ^/r/([a-zA-Z0-9_-]+)$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow caching of redirect responses at CDN level
        proxy_hide_header  Cache-Control;
        add_header         Cache-Control "public, max-age=300";
    }

    # 2. Password verification (POST /r/slug/password → backend, GET → frontend)
    # limit_except only accepts proxy_pass; proxy headers must be at location level.
    location ~ ^/r/([a-zA-Z0-9_-]+)/password$ {
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        limit_except GET HEAD OPTIONS {
            proxy_pass http://127.0.0.1:3001;
        }
        # GET requests — serve the React SPA
        try_files $uri $uri/ /index.html;
    }

    # 3. All other /r/ sub-paths (like /expired) fall through to frontend
    location /r/ {
        try_files $uri $uri/ /index.html;
    }

    # User-uploaded files
    location /uploads/ {
        alias /var/www/GenXQR/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        # Prevent script execution in uploads
        location ~* \.(php|pl|py|sh|cgi)$ {
            deny all;
        }
    }

    # React SPA fallback — serve index.html for all unmatched routes
    location / {
        limit_req zone=static burst=100 nodelay;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
