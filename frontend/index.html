<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons. The SVG is preferred by modern browsers and scales cleanly;
         the PNGs are fallbacks, and browsers pick the closest `sizes` match.
         NOTE: the declared sizes are the files' ACTUAL dimensions, which are
         each 1px larger than their names suggest (17/33/49/181 rather than
         16/32/48/180) — an export setting on the source artwork. Declaring
         the true size is correct; re-exporting at exact sizes would render
         more crisply, since a 17px icon has to be resampled to fit a 16px slot. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="17x17" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="33x33" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="49x49" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GenXQR" />

    <!-- Fonts. Loaded here rather than via @import in index.css so the preload
         scanner can start the request during initial HTML parse instead of
         waiting for the stylesheet to download and parse first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!--
      Fallback SEO tags only. Every marketing page overrides these at runtime
      via <SEOMeta> (react-helmet-async), which also emits the canonical URL.
      These matter for crawlers that don't execute JS and for the brief window
      before React mounts, so they must stay accurate.
    -->
    <title>GenXQR — QR Code Generator with Analytics</title>
    <meta
      name="description"
      content="Create dynamic QR codes with editable destinations, real-time scan analytics, A/B testing, and smart routing. 16 QR types including URL, vCard, Wi-Fi, PDF, and menus. Free plan available."
    />
    <meta name="author" content="GenXQR" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://genxqr.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GenXQR" />
    <meta property="og:title" content="GenXQR — QR Code Generator with Analytics" />
    <meta
      property="og:description"
      content="Create dynamic QR codes with editable destinations, real-time scan analytics, A/B testing, and smart routing. Free plan available."
    />
    <!-- 1200x630 is the 1.91:1 ratio Facebook, LinkedIn and X render as a
         large card without cropping. These values must match the actual file. -->
    <meta property="og:image" content="https://genxqr.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GenXQR — QR Code Generator with Analytics" />
    <meta property="og:url" content="https://genxqr.com/" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@GenXQR" />
    <meta name="twitter:creator" content="@GenXQR" />
    <meta name="twitter:title" content="GenXQR — QR Code Generator with Analytics" />
    <meta
      name="twitter:description"
      content="Create dynamic QR codes with editable destinations, real-time scan analytics, A/B testing, and smart routing. Free plan available."
    />
    <meta name="twitter:image" content="https://genxqr.com/og-image.png" />
    <meta name="twitter:image:alt" content="GenXQR — QR Code Generator with Analytics" />

    <!-- Inline theme init: prevents flash of wrong theme before React mounts -->
    <script>
      (function () {
        // Theme — light is the default; only go dark if the user explicitly chose it.
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        // RTL language direction
        var lang = localStorage.getItem('GenXQR_lang') || '';
        var rtlCodes = ['ar','he','fa','ur','ps','sd','ug','yi'];
        if (lang && rtlCodes.indexOf(lang) !== -1) {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = lang;
        } else if (lang) {
          document.documentElement.lang = lang;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
