<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GenXQR" />

    <!-- Primary SEO -->
    <title>GenXQR — Smart QR Codes for Every Need</title>
    <meta name="description" content="Generate, track, and analyze QR codes for every use case — links, vCards, Wi-Fi, menus, and more. Free tier available." />
    <meta name="keywords" content="QR code generator, dynamic QR code, QR code tracker, QR code analytics, free QR code" />
    <meta name="author" content="GenXQR" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GenXQR" />
    <meta property="og:title" content="GenXQR — Smart QR Codes for Every Need" />
    <meta property="og:description" content="Generate, track, and analyze QR codes for every use case — links, vCards, Wi-Fi, menus, and more." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://genxqr.io" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@GenXQR" />
    <meta name="twitter:title" content="GenXQR — Smart QR Codes for Every Need" />
    <meta name="twitter:description" content="Generate, track, and analyze QR codes for every use case." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Inline theme init: prevents flash of wrong theme before React mounts -->
    <script>
      (function () {
        // Theme — light is the default; only go dark if the user explicitly chose it.
        var stored = localStorage.getItem('theme');
        var dark = stored === 'dark';
        document.documentElement.classList.toggle('dark', dark);
        // RTL language direction
        var lang = localStorage.getItem('GenXQR_lang') || '';
        var rtlCodes = ['ar','he','fa','ur','ps','sd','ug','yi'];
        if (lang && rtlCodes.indexOf(lang) !== -1) {
          document.documentElement.dir = 'rtl';
          document.documentElement.lang = lang;
        } else if (lang) {
          document.documentElement.lang = lang;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
